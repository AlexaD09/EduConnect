services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosqdata:/mosquitto/data
      - mosqlog:/mosquitto/log

volumes:
  mosqdata:
  mosqlog:
