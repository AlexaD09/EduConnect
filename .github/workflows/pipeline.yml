name: Pipeline (Infra → Runtime → Services)

on:
  push:
    branches: [features, qa, main]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.filter.outputs.infra }}
      runtime_changed: ${{ steps.filter.outputs.runtime }}
      services_changed: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            infra:
              - 'infra/**'
            runtime:
              - 'runtime/**'
            services:
              - 'packages/**'

  infra:
    needs: detect
    if: needs.detect.outputs.infra_changed == 'true'
    uses: ./.github/workflows/infra-apply.yml
    secrets: inherit

  runtime:
    needs: [detect, infra]
    
    if: always() && needs.detect.outputs.runtime_changed == 'true' && (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    uses: ./.github/workflows/runtime.yml
    with:
      base: ${{ github.event.before }}
    secrets: inherit

  services:
    needs: [detect, infra, runtime]
    
    if: always() && needs.detect.outputs.services_changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      base: ${{ github.event.before }}
    secrets: inherit
