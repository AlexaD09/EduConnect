name: Runtime Deploy (Turbo)

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string

jobs:
  runtime:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure turbo base commit is available
        run: |
          echo "Turbo base: ${{ inputs.base }}"
          
          git cat-file -e "${{ inputs.base }}"^{commit} 2>/dev/null || \
            git fetch --no-tags --prune --depth=0 origin "${{ inputs.base }}"

          
          git cat-file -e "${{ inputs.base }}"^{commit}
    

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install deps
        run: npm install
      - name: Choose backend by branch
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "TF_BACKEND=backend-prod.hcl" >> $GITHUB_ENV
          else
            echo "TF_BACKEND=backend-qa.hcl" >> $GITHUB_ENV
          fi

      - name: Configure AWS creds (bastion account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_BASTION_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BASTION_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_BASTION_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform init (read outputs)
        run: |
          terraform -chdir=infra/terraform init -reconfigure -input=false -backend-config=$TF_BACKEND

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_QA }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Disable SSH host key checking (CI)
        run: |
          cat > ~/.ssh/config <<'CFG'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CFG
          chmod 600 ~/.ssh/config
    

      - name: Deploy runtime with Turbo
        env:
          SSH_USER: ec2-user
          REMOTE_DIR_BASE: /home/ec2-user/runtime
        run: |
          export SSH_USER
          export REMOTE_DIR_BASE
          export BASTION_HOST="$(terraform -chdir=infra/terraform output -raw bastion_public_ip)"
          export ENDPOINTS_JSON="$(terraform -chdir=infra/terraform output -json service_endpoints)"

          npx turbo run deploy --filter="runtime-*...[${{ inputs.base }}]"

