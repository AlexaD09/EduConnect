name: Runtime Deploy (Turbo)

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string

jobs:
  runtime:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure turbo base commit is available
        run: |
          echo "Turbo base: ${{ inputs.base }}"
          
          git cat-file -e "${{ inputs.base }}"^{commit} 2>/dev/null || \
            git fetch --no-tags --prune --depth=0 origin "${{ inputs.base }}"

          
          git cat-file -e "${{ inputs.base }}"^{commit}
    

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install deps
        run: npm install
      - name: Choose backend by branch
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "TF_BACKEND=backend-prod.hcl" >> $GITHUB_ENV
          else
            echo "TF_BACKEND=backend-qa.hcl" >> $GITHUB_ENV
          fi

      - name: Configure AWS creds (bastion account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_BASTION_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BASTION_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_BASTION_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform init (read outputs)
        run: |
          terraform -chdir=infra/terraform init -reconfigure -input=false -backend-config=$TF_BACKEND

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_QA }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Disable SSH host key checking (CI)
        run: |
          cat > ~/.ssh/config <<'CFG'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          CFG
          chmod 600 ~/.ssh/config
    
      - name: Bootstrap Docker on runtime hosts
        env:
          SSH_USER: ec2-user
        run: |
          set -e

          export BASTION_HOST="$(terraform -chdir=infra/terraform output -raw bastion_public_ip)"
          export ENDPOINTS_JSON="$(terraform -chdir=infra/terraform output -json service_endpoints | tr -d '\n')"

          echo "Bastion: $BASTION_HOST"

          IPS=$(python3 - <<'PY'
          import json, os
          d = json.loads(os.environ["ENDPOINTS_JSON"])
          keys = ["kafka","mongo","mqtt","postgres","rabbitmq","redis"]
          print(" ".join([d[k]["ip"] for k in keys if k in d and "ip" in d[k]]))
          PY
              )

              echo "Runtime IPs: $IPS"

              for IP in $IPS; do
                echo "Bootstrapping docker on $IP..."
                ssh -J ${SSH_USER}@${BASTION_HOST} ${SSH_USER}@${IP} 'bash -s' <<'EOS'
          set -e
          if ! command -v docker >/dev/null 2>&1; then
            sudo yum -y update || true
            sudo amazon-linux-extras install -y docker || sudo yum -y install docker
          fi
          sudo systemctl enable --now docker

          if ! docker compose version >/dev/null 2>&1; then
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
              -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
          fi
          EOS
          done

      
      - name: Deploy runtime with Turbo
        env:
          SSH_USER: ec2-user
          REMOTE_DIR_BASE: /home/ec2-user/runtime
        run: |
          export SSH_USER
          export REMOTE_DIR_BASE
          export BASTION_HOST="$(terraform -chdir=infra/terraform output -raw bastion_public_ip)"
          export ENDPOINTS_JSON="$(terraform -chdir=infra/terraform output -json service_endpoints)"

          npx turbo run deploy --filter="runtime-*...[${{ inputs.base }}]"

